apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: ai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
        - name: docs
          image: ai-app-docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: ai-app
spec:
  selector:
    app: docs
  ports:
    - port: 80
      targetPort: 80
